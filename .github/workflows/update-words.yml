name: Update game words
on:
  schedule:
    - cron: '17 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: update-game-words
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - run: python3 scripts/update-words.py
      - name: Publish new words
        run: |
          git add -- backend/internal/game/words.txt
          if test -f backend/internal/game/words.sync-week; then
            git add -- backend/internal/game/words.sync-week
          fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Refresh this week's drawing words"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
