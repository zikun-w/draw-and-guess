# Example only: apply equivalent settings through your site manager.
# Replace the domain, certificate paths and frontend root for your environment.
server {
    listen 80;
    listen [::]:80;
    server_name game.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name game.example.com;
    ssl_certificate /www/sites/game.example.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/game.example.com/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /www/sites/drawguess/index;
    index index.html;
    client_max_body_size 32k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location ~ ^/(api/|ws$|healthz$) {
        proxy_pass http://127.0.0.1:25570;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
